# Managed Cloudflare zones — single source of truth.
# One Pulumi stack per zone; stack name = domain key.
#
# role: product — zone lifecycle/baselines here; product DNS/Pages elsewhere
#             unless githubPages is set (this repo owns GitHub Pages origin DNS)
# role: vanity  — org redirect only; requires redirectTo (canonical host, no scheme)

zones:
  archlens.dev:
    role: product
    notes: ArchLens product zone

  eval-driven-development.dev:
    role: product
    githubPages: mzworthington.github.io
    notes: Agent Lifecycle Kit / EDD site (GitHub Pages origin DNS in this repo)

  matthewworthington.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  mzworthington.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  mzworthington.co.uk:
    role: product
    notes: Personal / blog 

  # --- GoDaddy onboarding (registrar stays at GoDaddy until NS cutover) ---
  # Out of scope this batch: siliconpanda.com / .co.uk (Google Workspace mail) — see TODO below.

  cloudymelon.com:
    role: product
    notes: Design publication- Middle East meets London 

  deema.design:
    role: product
    notes: Personal / block / Portfolio 

  ifinditreallygood.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  ifinditreallygood.co.uk:
    role: vanity
    redirectTo: mzworthington.co.uk

  its-really-good.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  its-really-good.co.uk:
    role: vanity
    redirectTo: mzworthington.co.uk


  matthewanddeema.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  really-good.club:
    role: vanity
    redirectTo: mzworthington.co.uk

  really-good.co.uk:
    role: vanity
    redirectTo: mzworthington.co.uk

  feed-replay.com:
    role: vanity
    redirectTo: mzworthington.co.uk

  feed-replay.co.uk:
    role: vanity
    redirectTo: mzworthington.co.uk

    

