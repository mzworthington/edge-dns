name: Pulumi apply

# Apply on main only. Environment "pulumi-prod" should require reviewers.

on:
  push:
    branches: [main]
    paths:
      - 'index.ts'
      - 'Pulumi.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'zones.txt'
      - 'components/**'
      - '.github/workflows/apply.yml'
      - '.github/actions/setup-edge-dns-pulumi/**'
  workflow_dispatch:
    inputs:
      stack:
        description: Zone stack to apply (domain). Empty = all zones in matrix.
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-dns-prod-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply (${{ matrix.stack }})
    runs-on: ubuntu-latest
    environment:
      name: pulumi-prod
    strategy:
      fail-fast: false
      matrix:
        stack:
          - archlens.dev
          - matthewworthington.com
          - mzworthington.com
          - mzworthington.co.uk
    steps:
      - name: Maybe skip stack
        id: gate
        shell: bash
        run: |
          WANT="${{ inputs.stack }}"
          if [[ -n "$WANT" && "$WANT" != "${{ matrix.stack }}" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup edge-dns Pulumi
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-edge-dns-pulumi
        with:
          stack: ${{ matrix.stack }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_DNS_MANAGE_SETTINGS: ${{ vars.EDGE_DNS_MANAGE_SETTINGS }}
          EDGE_DNS_SSL: ${{ vars.EDGE_DNS_SSL }}
          EDGE_DNS_ALWAYS_USE_HTTPS: ${{ vars.EDGE_DNS_ALWAYS_USE_HTTPS }}
          EDGE_DNS_MIN_TLS_VERSION: ${{ vars.EDGE_DNS_MIN_TLS_VERSION }}
          EDGE_DNS_AUTOMATIC_HTTPS_REWRITES: ${{ vars.EDGE_DNS_AUTOMATIC_HTTPS_REWRITES }}
          EDGE_DNS_TLS13: ${{ vars.EDGE_DNS_TLS13 }}

      - name: Pulumi up
        if: steps.gate.outputs.run == 'true'
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ matrix.stack }}
          work-dir: .
          diff: true
          color: always
          suppress-progress: true
          comment-on-summary: true
          always-include-summary: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
