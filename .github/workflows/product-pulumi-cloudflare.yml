name: Product Pulumi Cloudflare

# Reusable workflow for product repos that own Pages/DNS (not zones).
# Call from a thin local workflow that owns path filters / dispatch inputs.
#
# Example (product repo):
#   jobs:
#     pulumi:
#       uses: mzworthington/edge-dns/.github/workflows/product-pulumi-cloudflare.yml@main
#       with:
#         work-dir: infra/cloudflare
#         stack-name: prod
#         tooling-ref: main   # pin to the same SHA as the workflow when freezing
#         apply: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      work-dir:
        description: Directory containing Pulumi.yaml
        type: string
        required: false
        default: infra/cloudflare
      stack-name:
        description: Pulumi stack name
        type: string
        required: false
        default: prod
      tooling-ref:
        description: >-
          Git ref of mzworthington/edge-dns used for composite actions
          (setup-pulumi-cloudflare, pulumi-rich-report). Pin to a SHA with the
          workflow ref when you want a frozen consumer.
        type: string
        required: false
        default: main
      environment:
        description: GitHub Environment for the apply gate
        type: string
        required: false
        default: pulumi-prod
      environment-url:
        description: Optional URL shown on the Environment deployment
        type: string
        required: false
        default: ''
      apply:
        description: When true (and on main), run pulumi up after preview
        type: boolean
        required: false
        default: true
      comment-on-pr:
        description: Post preview summary on pull requests
        type: boolean
        required: false
        default: true
      apply-concurrency-group:
        description: Concurrency group for apply (avoids Pulumi 409 conflicts)
        type: string
        required: false
        default: pulumi-cloudflare-prod-apply
      pnpm-version:
        type: string
        required: false
        default: '11.20.0'
      node-version:
        type: string
        required: false
        default: '24'
      extra-config:
        description: Multiline KEY=VALUE Pulumi config forwarded to setup action
        type: string
        required: false
        default: ''
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ZONE_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: product-pulumi-cloudflare-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product repo
        uses: actions/checkout@v7

      - name: Checkout edge-dns tooling
        uses: actions/checkout@v7
        with:
          repository: mzworthington/edge-dns
          ref: ${{ inputs.tooling-ref }}
          path: .edge-dns-tooling
          sparse-checkout: |
            .github/actions

      - name: Setup Pulumi Cloudflare
        uses: ./.edge-dns-tooling/.github/actions/setup-pulumi-cloudflare
        with:
          work-dir: ${{ inputs.work-dir }}
          stack-name: ${{ inputs.stack-name }}
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.work-dir }}/pnpm-lock.yaml
          extra-config: ${{ inputs.extra-config }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_PAGES_PROJECT_NAME: ${{ vars.PULUMI_PAGES_PROJECT_NAME }}
          PULUMI_PAGES_HOSTNAMES: ${{ vars.PULUMI_PAGES_HOSTNAMES }}
          PULUMI_APEX_DOMAIN: ${{ vars.PULUMI_APEX_DOMAIN }}
          PULUMI_WWW_DOMAIN: ${{ vars.PULUMI_WWW_DOMAIN }}
          PULUMI_CATALOG_BUCKET_NAME: ${{ vars.PULUMI_CATALOG_BUCKET_NAME }}
          PULUMI_CATALOG_DOMAIN: ${{ vars.PULUMI_CATALOG_DOMAIN }}

      - name: Pulumi preview
        uses: ./.edge-dns-tooling/.github/actions/pulumi-rich-report
        with:
          command: preview
          stack-name: ${{ inputs.stack-name }}
          work-dir: ${{ inputs.work-dir }}
          comment-on-pr: ${{ inputs.comment-on-pr && github.event_name == 'pull_request' }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  apply:
    name: Apply
    if: >
      inputs.apply &&
      github.ref == 'refs/heads/main'
    needs: [preview]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    concurrency:
      group: ${{ inputs.apply-concurrency-group }}
      cancel-in-progress: false
    steps:
      - name: Checkout product repo
        uses: actions/checkout@v7

      - name: Checkout edge-dns tooling
        uses: actions/checkout@v7
        with:
          repository: mzworthington/edge-dns
          ref: ${{ inputs.tooling-ref }}
          path: .edge-dns-tooling
          sparse-checkout: |
            .github/actions

      - name: Setup Pulumi Cloudflare
        uses: ./.edge-dns-tooling/.github/actions/setup-pulumi-cloudflare
        with:
          work-dir: ${{ inputs.work-dir }}
          stack-name: ${{ inputs.stack-name }}
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.work-dir }}/pnpm-lock.yaml
          extra-config: ${{ inputs.extra-config }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_PAGES_PROJECT_NAME: ${{ vars.PULUMI_PAGES_PROJECT_NAME }}
          PULUMI_PAGES_HOSTNAMES: ${{ vars.PULUMI_PAGES_HOSTNAMES }}
          PULUMI_APEX_DOMAIN: ${{ vars.PULUMI_APEX_DOMAIN }}
          PULUMI_WWW_DOMAIN: ${{ vars.PULUMI_WWW_DOMAIN }}
          PULUMI_CATALOG_BUCKET_NAME: ${{ vars.PULUMI_CATALOG_BUCKET_NAME }}
          PULUMI_CATALOG_DOMAIN: ${{ vars.PULUMI_CATALOG_DOMAIN }}

      - name: Pulumi up
        uses: ./.edge-dns-tooling/.github/actions/pulumi-rich-report
        with:
          command: up
          stack-name: ${{ inputs.stack-name }}
          work-dir: ${{ inputs.work-dir }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
