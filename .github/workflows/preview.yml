name: Pulumi preview

on:
  pull_request:
    paths:
      - 'zones/archlens.dev/**'
      - 'components/**'
      - '.github/workflows/preview.yml'
      - '.github/workflows/apply.yml'
      - '.github/actions/setup-edge-dns-pulumi/**'
  push:
    branches: [main]
    paths:
      - 'zones/archlens.dev/**'
      - 'components/**'
      - '.github/workflows/preview.yml'
      - '.github/workflows/apply.yml'
      - '.github/actions/setup-edge-dns-pulumi/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: edge-dns-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup edge-dns Pulumi
        uses: ./.github/actions/setup-edge-dns-pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_DNS_ZONE_NAME: ${{ vars.EDGE_DNS_ZONE_NAME }}
          EDGE_DNS_SSL: ${{ vars.EDGE_DNS_SSL }}
          EDGE_DNS_ALWAYS_USE_HTTPS: ${{ vars.EDGE_DNS_ALWAYS_USE_HTTPS }}
          EDGE_DNS_MIN_TLS_VERSION: ${{ vars.EDGE_DNS_MIN_TLS_VERSION }}
          EDGE_DNS_AUTOMATIC_HTTPS_REWRITES: ${{ vars.EDGE_DNS_AUTOMATIC_HTTPS_REWRITES }}
          EDGE_DNS_TLS13: ${{ vars.EDGE_DNS_TLS13 }}

      - name: Pulumi Cloud dashboard link
        id: dashboard
        working-directory: zones/archlens.dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          FQ="$(pulumi stack --show-name -Q)"
          URL="https://app.pulumi.com/${FQ}"
          echo "stack=${FQ}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pulumi Cloud"
            echo ""
            echo "- **Stack:** \`${FQ}\`"
            echo "- **Dashboard:** [${FQ}](${URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pulumi preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: prod
          work-dir: zones/archlens.dev
          diff: true
          color: always
          suppress-progress: true
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
          comment-on-summary: true
          always-include-summary: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
