name: Inject Web Analytics beacon
description: >
  Insert the Cloudflare Web Analytics (RUM) JS snippet into built HTML.
  Pages and Workers skip zone auto-inject; this uses the zone's existing
  WebAnalyticsSite token from the RUM API.
inputs:
  html-path:
    description: HTML file or directory (walks *.html) to inject into
    required: true
  spa:
    description: Set spa:true on the beacon (React / Vue / history-API apps)
    required: false
    default: 'false'
  required:
    description: Fail when the zone has no Web Analytics site (false = skip)
    required: false
    default: 'true'
  account-id:
    description: Cloudflare account id
    required: true
  zone-id:
    description: Cloudflare zone id whose Web Analytics site to use
    required: true
  api-token:
    description: Cloudflare API token (Account Settings Read for RUM)
    required: true
runs:
  using: composite
  steps:
    - name: Inject Cloudflare Web Analytics beacon
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        CLOUDFLARE_ZONE_ID: ${{ inputs.zone-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
      run: |
        set -euo pipefail
        args=()
        if [[ "${{ inputs.spa }}" == "true" ]]; then
          args+=(--spa)
        fi
        if [[ "${{ inputs.required }}" != "true" ]]; then
          args+=(--optional)
        fi
        node "$GITHUB_ACTION_PATH/../../../scripts/inject-web-analytics.cjs" \
          "${args[@]}" -- "${{ inputs.html-path }}"
