name: Setup edge-dns Pulumi
description: Install deps and configure one edge-dns stack (zone name = stack name) from secrets
inputs:
  stack:
    description: Pulumi stack name (domain), e.g. archlens.dev
    required: true
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.20.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Pulumi CLI
      uses: pulumi/setup-pulumi@v2

    - name: Configure Pulumi stack
      shell: bash
      env:
        PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        STACK: ${{ inputs.stack }}
        EDGE_DNS_SSL: ${{ env.EDGE_DNS_SSL }}
        EDGE_DNS_ALWAYS_USE_HTTPS: ${{ env.EDGE_DNS_ALWAYS_USE_HTTPS }}
        EDGE_DNS_MIN_TLS_VERSION: ${{ env.EDGE_DNS_MIN_TLS_VERSION }}
        EDGE_DNS_AUTOMATIC_HTTPS_REWRITES: ${{ env.EDGE_DNS_AUTOMATIC_HTTPS_REWRITES }}
        EDGE_DNS_TLS13: ${{ env.EDGE_DNS_TLS13 }}
        EDGE_DNS_MANAGE_SETTINGS: ${{ env.EDGE_DNS_MANAGE_SETTINGS }}
      run: |
        set -euo pipefail
        pulumi stack select "$STACK" 2>/dev/null || pulumi stack init "$STACK"
        pulumi config set accountId "$CLOUDFLARE_ACCOUNT_ID"
        pulumi config set zoneName "$STACK"
        pulumi config set manageSettings "${EDGE_DNS_MANAGE_SETTINGS:-false}"
        pulumi config set ssl "${EDGE_DNS_SSL:-full}"
        pulumi config set alwaysUseHttps "${EDGE_DNS_ALWAYS_USE_HTTPS:-on}"
        pulumi config set minTlsVersion "${EDGE_DNS_MIN_TLS_VERSION:-1.2}"
        pulumi config set automaticHttpsRewrites "${EDGE_DNS_AUTOMATIC_HTTPS_REWRITES:-on}"
        pulumi config set tls13 "${EDGE_DNS_TLS13:-on}"
        pulumi config set --secret cloudflare:apiToken "$CLOUDFLARE_API_TOKEN"
