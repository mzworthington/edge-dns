name: Setup edge-dns Pulumi
description: Install deps and select one edge-dns stack (zone name = stack name)
inputs:
  stack:
    description: Pulumi stack name (domain), e.g. archlens.dev
    required: true
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.20.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Pulumi CLI
      uses: pulumi/setup-pulumi@v2

    - name: Select Pulumi stack
      shell: bash
      env:
        PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        pulumi stack select "$STACK" 2>/dev/null || pulumi stack init "$STACK"
        pulumi stack export --stack "$STACK" | node scripts/assert-stack-zone-state.cjs "$STACK"
