name: Setup Pulumi Cloudflare
description: >-
  Install Node/pnpm deps and configure a product Cloudflare Pulumi stack
  (accountId, zoneId, apiToken, optional Pages/catalog config) from env.
inputs:
  work-dir:
    description: Directory containing Pulumi.yaml (product Cloudflare stack)
    required: false
    default: infra/cloudflare
  stack-name:
    description: Pulumi stack name
    required: false
    default: prod
  pnpm-version:
    description: pnpm version to install
    required: false
    default: '11.20.0'
  node-version:
    description: Node.js version
    required: false
    default: '24'
  cache-dependency-path:
    description: Path to pnpm-lock.yaml for cache
    required: false
    default: infra/cloudflare/pnpm-lock.yaml
  extra-config:
    description: >-
      Optional multiline KEY=VALUE Pulumi config (non-secret). Applied after
      standard Cloudflare / Pages keys. Example: catalogBucketName=my-bucket
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: pnpm install --frozen-lockfile

    - name: Setup Pulumi CLI
      uses: pulumi/setup-pulumi@v2

    - name: Configure Pulumi stack
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      env:
        PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_ZONE_ID: ${{ env.CLOUDFLARE_ZONE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        STACK_NAME: ${{ inputs.stack-name }}
        PULUMI_PAGES_PROJECT_NAME: ${{ env.PULUMI_PAGES_PROJECT_NAME }}
        PULUMI_PAGES_HOSTNAMES: ${{ env.PULUMI_PAGES_HOSTNAMES }}
        PULUMI_APEX_DOMAIN: ${{ env.PULUMI_APEX_DOMAIN }}
        PULUMI_WWW_DOMAIN: ${{ env.PULUMI_WWW_DOMAIN }}
        PULUMI_CATALOG_BUCKET_NAME: ${{ env.PULUMI_CATALOG_BUCKET_NAME }}
        PULUMI_CATALOG_DOMAIN: ${{ env.PULUMI_CATALOG_DOMAIN }}
        EXTRA_CONFIG: ${{ inputs.extra-config }}
      run: |
        set -euo pipefail

        : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}"
        : "${CLOUDFLARE_ZONE_ID:?Set CLOUDFLARE_ZONE_ID}"
        : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"

        pulumi stack select "$STACK_NAME" 2>/dev/null || pulumi stack init "$STACK_NAME"
        pulumi config set accountId "$CLOUDFLARE_ACCOUNT_ID"
        pulumi config set zoneId "$CLOUDFLARE_ZONE_ID"
        pulumi config set --secret cloudflare:apiToken "$CLOUDFLARE_API_TOKEN"

        if [[ -n "${PULUMI_PAGES_PROJECT_NAME:-}" ]]; then
          pulumi config set pagesProjectName "$PULUMI_PAGES_PROJECT_NAME"
        fi
        if [[ -n "${PULUMI_PAGES_HOSTNAMES:-}" ]]; then
          pulumi config set pagesHostnames "$PULUMI_PAGES_HOSTNAMES" --plaintext
        fi
        if [[ -n "${PULUMI_APEX_DOMAIN:-}" ]]; then
          pulumi config set apexDomain "$PULUMI_APEX_DOMAIN"
        fi
        if [[ -n "${PULUMI_WWW_DOMAIN:-}" ]]; then
          pulumi config set wwwDomain "$PULUMI_WWW_DOMAIN"
        fi
        if [[ -n "${PULUMI_CATALOG_BUCKET_NAME:-}" ]]; then
          pulumi config set catalogBucketName "$PULUMI_CATALOG_BUCKET_NAME"
        fi
        if [[ -n "${PULUMI_CATALOG_DOMAIN:-}" ]]; then
          pulumi config set catalogDomain "$PULUMI_CATALOG_DOMAIN"
        fi

        if [[ -n "${EXTRA_CONFIG:-}" ]]; then
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            [[ -n "$key" && "$key" != "$line" ]] || {
              echo "Invalid extra-config line (expected KEY=VALUE): $line" >&2
              exit 1
            }
            pulumi config set "$key" "$val" --plaintext
          done <<< "$EXTRA_CONFIG"
        fi
